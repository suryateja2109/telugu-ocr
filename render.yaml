services:
  - type: web
    name: telugu-book-portal
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 deploy_seed.py && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: telugu-book-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: telugu-book-db
    plan: free
